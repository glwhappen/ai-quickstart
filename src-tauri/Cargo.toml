[package]
name = "codex-quickstart"
version = "0.1.0"
description = "Codex 快速配置"
authors = ["hsfp"]
edition = "2021"
rust-version = "1.85.0"

[lib]
name = "codex_quickstart_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
tauri = { version = "2.8.2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
